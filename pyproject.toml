[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-ai-editor"
version = "0.1.0"
description = "Local AI editor for cinematic gameplay highlight reels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.4",
  "numpy>=1.26.4",
  "opencv-python>=4.10.0",
  "faster-whisper>=1.0.1",
  "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.5.0", "mypy>=1.10.0"]
# faster-whisper's inference backend is CTranslate2, not torch - torch is only
# imported by diagnostics.py's optional GPU readout, which already tolerates
# it being absent. Keep it out of the default install (~500MB CPU wheel) and
# out of the PyInstaller bundle (already excluded in packaging/*.spec).
gpu-diagnostics = ["torch>=2.6.0"]

[project.scripts]
game-ai-editor = "game_ai_editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = ["src/game_ai_editor/desktop/*"]

[tool.coverage.report]
fail_under = 70

[tool.pytest.ini_options]
testpaths = ["tests"]
