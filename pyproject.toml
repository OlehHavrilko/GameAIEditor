[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-ai-editor"
version = "0.1.0"
description = "Local AI editor for cinematic gameplay highlight reels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.4",
  "numpy>=1.26.4",
  "opencv-python>=4.10.0",
  "faster-whisper>=1.0.1",
  "pytesseract>=0.3.13",
  "easyocr>=1.7.2",
  "transformers>=4.45.2",
  "torch>=2.6.0",
  "ffmpeg-python>=0.2.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.5.0"]

[project.scripts]
game-ai-editor = "game_ai_editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
